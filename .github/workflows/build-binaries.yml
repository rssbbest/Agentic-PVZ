name: Build SDK binaries

# One-file `autopilot` executables, each smoke-tested on its own OS
# (tests/smoke_binary.py plays a whole game through the binary).
# Run by hand for every OS, or from deploy.yml (Windows and Linux) on each
# push to test_branch.
on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS binaries (arm64 and Intel)"
        type: boolean
        default: true
      macos_arm64_only:
        description: "Only the macOS arm64 binary (one paid macOS runner, nothing else)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_arm64_only && '[{"os":"macos-15","name":"autopilot-macos-arm64"}]' || inputs.macos && '[{"os":"windows-2022","name":"autopilot-windows-x86_64.exe"},{"os":"macos-15","name":"autopilot-macos-arm64"},{"os":"macos-15-intel","name":"autopilot-macos-x86_64"}]' || '[{"os":"windows-2022","name":"autopilot-windows-x86_64.exe"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: autopilot-sdk-binary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[build]"
      - run: python build_binary.py
      - name: Smoke test (version, verify dry run, a full game, the interactive console)
        run: python tests/smoke_binary.py dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: autopilot-sdk-binary/dist/${{ matrix.name }}
          if-no-files-found: error
      - name: Update smoke test (an older build of this SDK updates itself to this one)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ../upd/new ../upd/wold ../upd/wnew
          for i in 1 2 3 4 5 6; do mv dist/${{ matrix.name }} ../upd/new/ && break; sleep 10; done  # Windows: a scan may hold it
          python -m pip wheel -q --no-deps -w ../upd/wnew .
          cp src/autopilot_sdk/__init__.py ../upd/init.py
          python -c "import pathlib,re; p=pathlib.Path('src/autopilot_sdk/__init__.py'); p.write_text(re.sub(r'__version__ = \"([^\"]+)\"', r'__version__ = \"\\1+older\"', p.read_text()))"
          rm -rf build/lib build/bdist.* src/*.egg-info
          python build_binary.py
          python -m pip wheel -q --no-deps -w ../upd/wold .
          cp ../upd/init.py src/autopilot_sdk/__init__.py
          python tests/smoke_update.py dist/${{ matrix.name }} ../upd/new/${{ matrix.name }} ../upd/wold ../upd/wnew

  # Linux on Debian 11 (glibc 2.31): a binary needs at least the glibc it was
  # built with, so this one runs on Ubuntu 20.04+, Debian 11+, Fedora 34+ and
  # the like. Older or non-x86 Linux uses the Python install (install.sh).
  build-linux:
    if: ${{ !inputs.macos_arm64_only }}
    runs-on: ubuntu-latest
    container: python:3.11-bullseye
    defaults:
      run:
        working-directory: autopilot-sdk-binary
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[build]"
      - run: python build_binary.py
      - name: Smoke test (version, verify dry run, a full game, the interactive console)
        run: python tests/smoke_binary.py dist/autopilot-linux-x86_64
      - name: Oldest glibc it needs
        run: objdump -T dist/autopilot-linux-x86_64 | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: autopilot-linux-x86_64
          path: autopilot-sdk-binary/dist/autopilot-linux-x86_64
          if-no-files-found: error
      - name: Update smoke test (an older build of this SDK updates itself to this one)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ../upd/new ../upd/wold ../upd/wnew
          for i in 1 2 3 4 5 6; do mv dist/autopilot-linux-x86_64 ../upd/new/ && break; sleep 10; done  # Windows: a scan may hold it
          python -m pip wheel -q --no-deps -w ../upd/wnew .
          cp src/autopilot_sdk/__init__.py ../upd/init.py
          python -c "import pathlib,re; p=pathlib.Path('src/autopilot_sdk/__init__.py'); p.write_text(re.sub(r'__version__ = \"([^\"]+)\"', r'__version__ = \"\\1+older\"', p.read_text()))"
          rm -rf build/lib build/bdist.* src/*.egg-info
          python build_binary.py
          python -m pip wheel -q --no-deps -w ../upd/wold .
          cp ../upd/init.py src/autopilot_sdk/__init__.py
          python tests/smoke_update.py dist/autopilot-linux-x86_64 ../upd/new/autopilot-linux-x86_64 ../upd/wold ../upd/wnew

