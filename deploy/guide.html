<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopilot Participant Guide</title>
<!-- Served by Caddy (templates) for /download/README_PARTICIPANT.md when a browser asks
     for it; curl, the install lines and ?raw get the plain Markdown file. -->
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --code-bg: #f6f8fa; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --code-bg: #161b22; --link: #4493f8; }
  }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 880px; padding: 32px 16px 64px; color: var(--fg); background: var(--bg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  a { color: var(--link); }
  h1, h2, h3 { line-height: 1.25; margin: 1.6em 0 0.6em; }
  h1 { font-size: 2em; border-bottom: 1px solid var(--line); padding-bottom: 0.3em; margin-top: 0; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
  code { font: 0.875em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg);
         padding: 0.15em 0.35em; border-radius: 6px; }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 6px; overflow-x: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; font-size: 0.85em; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1em 0; }
  th, td { border: 1px solid var(--line); padding: 6px 13px; text-align: left; }
  th { background: var(--code-bg); }
  blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--line); }
  nav { display: flex; justify-content: space-between; margin-bottom: 1em; font-size: 0.9em; }
  nav a:last-child { color: var(--muted); }
</style>
</head>
<body>
<nav><a href="/guide/event">Detailed player guide</a><a href="/download/README_PARTICIPANT.md?raw">Plain Markdown</a></nav>
{{ include "README_PARTICIPANT.md" | markdown }}
</body>
</html>
