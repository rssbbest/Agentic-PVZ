[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-sdk"
version = "0.3.0"
description = "Autopilot SDK — participant runner for the zombie-defense game (offline-capable core)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31",
  "rich>=13.7",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
autopilot = "autopilot_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
autopilot_sdk = ["py.typed"]
