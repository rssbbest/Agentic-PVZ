<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autopilot Live Demo</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
iframe { position: absolute; border: 0; transform-origin: 0 0; transition: all .6s ease; background: #0d1117;
  border-radius: 10px; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
#game { width: 1290px; height: 790px; background: #000; }
.tag { position: absolute; font-size: 12px; color: #9aa4b1; letter-spacing: .5px; text-transform: uppercase; transition: all .6s ease; }
#overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hl { position: absolute; border: 3px solid #ffcc33; border-radius: 10px; box-shadow: 0 0 0 4px rgba(255, 204, 51, .25), 0 0 24px rgba(255, 204, 51, .5);
  animation: pulse 1.6s ease-in-out infinite; }
.hl.spot { box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55), 0 0 24px rgba(255, 204, 51, .6); }
.hl.green { border-color: #3fb950; box-shadow: 0 0 0 4px rgba(63, 185, 80, .25), 0 0 24px rgba(63, 185, 80, .5); }
.hl.purple { border-color: #c297ff; box-shadow: 0 0 0 4px rgba(194, 151, 255, .25), 0 0 24px rgba(194, 151, 255, .5); }
@keyframes pulse { 50% { border-width: 4px; } }
.hl .lbl { position: absolute; left: -3px; top: -34px; background: #ffcc33; color: #111; font-weight: 700; font-size: 15px;
  padding: 4px 10px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
.hl.green .lbl { background: #3fb950; } .hl.purple .lbl { background: #c297ff; }
.hl .lbl.below { top: auto; bottom: -34px; }
#caption { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(1100px, 86vw);
  background: rgba(10, 14, 20, .94); color: #f0f4f8; border: 1px solid #2d3540; border-left: 6px solid #ffcc33; border-radius: 12px;
  padding: 14px 22px 16px; z-index: 20; box-shadow: 0 10px 40px rgba(0,0,0,.6); transition: opacity .3s; }
#caption .step { color: #ffcc33; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
#caption .title { font-size: 24px; font-weight: 700; margin: 2px 0 4px; }
#caption .text { font-size: 17px; line-height: 1.45; color: #c9d3de; }
#caption.hide { opacity: 0; }
#panel { position: absolute; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(5, 8, 12, .86); }
#panel.on { display: grid; }
#panel .card { width: min(1150px, 90vw); background: #11161d; border: 1px solid #2d3540; border-radius: 16px; padding: 34px 44px;
  color: #e6edf3; box-shadow: 0 20px 80px rgba(0,0,0,.7); }
#panel h1 { margin: 0 0 6px; font-size: 34px; } #panel h2 { margin: 0 0 22px; font-size: 18px; color: #9aa4b1; font-weight: 500; }
#panel ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; }
#panel li { font-size: 17px; line-height: 1.4; padding-left: 30px; position: relative; }
#panel li::before { content: "✓"; position: absolute; left: 0; color: #3fb950; font-weight: 800; }
#panel li.flow::before { content: "→"; color: #ffcc33; }
#panel .big { display: flex; gap: 18px; margin: 0 0 24px; flex-wrap: wrap; }
#panel .big div { background: #1a212b; border: 1px solid #2d3540; border-radius: 12px; padding: 12px 18px; min-width: 150px; }
#panel .big b { display: block; font-size: 30px; color: #ffcc33; } #panel .big span { color: #9aa4b1; font-size: 13px; }
</style>
</head>
<body>
<iframe id="code" src="/code" title="Agent code"></iframe>
<iframe id="monitor" src="/" title="Live monitor"></iframe>
<iframe id="game" src="about:blank" title="Unity game" allow="autoplay; fullscreen"></iframe>
<div class="tag" id="tag-code">agent.py · participant code</div>
<div class="tag" id="tag-monitor">live monitor · every exchange</div>
<div class="tag" id="tag-game">Unity game · build11</div>
<div id="overlay"><svg id="svg"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffcc33"/></marker></defs></svg></div>
<div id="caption" class="hide"><div class="step" id="cstep"></div><div class="title" id="ctitle"></div><div class="text" id="ctext"></div></div>
<div id="panel"><div class="card" id="pcard"></div></div>
<script>
const F = {code: document.getElementById("code"), monitor: document.getElementById("monitor"), game: document.getElementById("game")};
const T = {code: document.getElementById("tag-code"), monitor: document.getElementById("tag-monitor"), game: document.getElementById("tag-game")};
let current = "intro", gameLive = false;

function place(name, x, y, w, h, show = true) {
  const f = F[name], tag = T[name];
  f.style.opacity = show ? 1 : 0; f.style.pointerEvents = show ? "auto" : "none";
  f.style.zIndex = show ? 2 : 1;
  if (name === "game") {
    const s = Math.min(w / 1290, h / 790);
    f.style.transform = `scale(${s})`;
    f.style.left = (x + (w - 1290 * s) / 2) + "px"; f.style.top = y + "px";
  } else {
    f.style.transform = "none";
    Object.assign(f.style, {left: x + "px", top: y + "px", width: w + "px", height: h + "px"});
  }
  Object.assign(tag.style, {left: x + "px", top: (y - 20) + "px", opacity: show ? 1 : 0});
}

function layout(mode) {
  current = mode || current;
  const W = innerWidth, H = innerHeight, m = 24, top = 34, bottom = 150;
  const fullH = H - top - bottom, pip = [W - 360 - m, top, 360, 220];
  const keepGame = (show) => gameLive && !show ? place("game", ...pip, true) : place("game", 0, 0, 1, 1, show);
  if (current === "code") { place("code", m, top, W - 2 * m, fullH); place("monitor", m, top, W - 2 * m, fullH, false); keepGame(false); }
  else if (current === "monitor") { place("monitor", m, top, W - 2 * m, fullH); place("code", m, top, W - 2 * m, fullH, false); keepGame(false); }
  else if (current === "game") { place("game", m, top, W - 2 * m, fullH); place("code", m, top, 10, 10, false); place("monitor", m, top, 10, 10, false); }
  else if (current === "split") {
    const gw = Math.round(W * 0.5);
    place("game", m, top, gw - m, fullH); place("monitor", gw + m / 2, top, W - gw - 1.5 * m, fullH); place("code", m, top, 10, 10, false);
  } else if (current === "code-game") {
    const cw = Math.round(W * 0.5);
    place("code", m, top, cw - m, fullH); place("game", cw + m / 2, top, W - cw - 1.5 * m, fullH); place("monitor", m, top, 10, 10, false);
  } else { place("code", 0, 0, 10, 10, false); place("monitor", 0, 0, 10, 10, false); keepGame(false); }
}
addEventListener("resize", () => layout());

const ov = document.getElementById("overlay"), svg = document.getElementById("svg");
window.demo = {
  mode(m) { layout(m); },
  loadGame(url) { F.game.src = url; },
  gameLive(on) { gameLive = on; layout(); },
  caption(step, title, text) {
    document.getElementById("cstep").textContent = step || "";
    document.getElementById("ctitle").textContent = title || "";
    document.getElementById("ctext").innerHTML = text || "";
    document.getElementById("caption").classList.toggle("hide", !title);
  },
  box(r, label, kind = "", below = false) {
    const d = document.createElement("div");
    d.className = "hl " + kind;
    Object.assign(d.style, {left: (r.x - 6) + "px", top: (r.y - 6) + "px", width: (r.width + 12) + "px", height: (r.height + 12) + "px"});
    if (label) d.innerHTML = `<span class="lbl${below || r.y < 70 ? " below" : ""}">${label}</span>`;
    ov.appendChild(d);
  },
  arrow(a, b, label) {
    const ns = "http://www.w3.org/2000/svg";
    const x1 = a.x + a.width / 2, y1 = a.y + a.height / 2, x2 = b.x + b.width / 2, y2 = b.y + b.height / 2;
    const p = document.createElementNS(ns, "path");
    const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 80;
    p.setAttribute("d", `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
    Object.entries({stroke: "#ffcc33", "stroke-width": 4, fill: "none", "stroke-dasharray": "10 7", "marker-end": "url(#head)"}).forEach(([k, v]) => p.setAttribute(k, v));
    svg.appendChild(p);
    if (label) {
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", mx); t.setAttribute("y", my + 26); t.setAttribute("text-anchor", "middle");
      Object.entries({fill: "#ffcc33", "font-size": 17, "font-weight": 700, stroke: "#0b0e13", "stroke-width": 4, "paint-order": "stroke"}).forEach(([k, v]) => t.setAttribute(k, v));
      t.textContent = label; svg.appendChild(t);
    }
  },
  clear() { ov.querySelectorAll(".hl").forEach((n) => n.remove()); svg.querySelectorAll("path, text").forEach((n) => n.remove()); },
  panel(html) { document.getElementById("pcard").innerHTML = html || ""; document.getElementById("panel").classList.toggle("on", !!html); },
};
layout("intro");
</script>
</body>
</html>
